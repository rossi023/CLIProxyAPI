# CLIProxyAPI Secure Configuration Template
# Copy this file to config.yaml and replace placeholder values
# NEVER commit config.yaml to version control

host: ""
port: 8317

remote-management:
  allow-remote: true
  management-key: "YOUR_MANAGEMENT_KEY_HERE"

management-password: "YOUR_MANAGEMENT_PASSWORD_HERE"

api-keys:
  - "YOUR_API_KEY_1"
  - "YOUR_API_KEY_2"

# OpenAI Compatibility - AMD
openai-compatibility:
  - name: "amd"
    base-url: "https://developer.amd.com.cn/radeon/api/v1"
    api-key-entries:
      - api-key: "YOUR_AMD_API_KEY_HERE"
    models:
      - name: "DeepSeek-V4-Flash"
        alias: "deepseek-v4-flash"
        display-name: "DeepSeek V4 Flash"
        max-context-length: 1048576
        thinking:
          levels: ["high", "medium", "low"]
      - name: "DeepSeek-V4-Flash-Vision-Exp"
        alias: "deepseek-v4-vision"
        display-name: "DeepSeek V4 Vision"
        max-context-length: 1048576
        input-modalities: ["text", "image"]
        thinking:
          levels: ["high", "medium", "low"]
      - name: "MiniCPM5-2B"
        alias: "minicpm5"
        display-name: "MiniCPM5 2B"
        max-context-length: 131072
        thinking:
          levels: ["high", "medium", "low"]
      - name: "Qwen3.8-Flash-Next"
        alias: "qwen3.8-flash"
        display-name: "Qwen 3.8 Flash Next"
        max-context-length: 262144
        input-modalities: ["text", "image"]
        thinking:
          levels: ["high", "medium", "low"]
